<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lottie con control accesible</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131c; color: #f5f7ff; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 2rem; }
    main { width: min(36rem, 100%); text-align: center; }
    #animation { width: min(18rem, 75vw); aspect-ratio: 1; margin: 1rem auto; }
    button { border: 0; border-radius: 999px; padding: .9rem 1.2rem; background: #88f0c8; color: #10131c; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>Lottie · renderer SVG</p>
    <h1>Pulso suave</h1>
    <p id="description">Ilustración decorativa. El texto describe el propósito sin depender del JSON animado.</p>
    <div id="animation" aria-hidden="true"></div>
    <button id="toggle" type="button" aria-pressed="false">Reproducir</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/lottie-web@5/build/player/lottie.min.js"></script>
  <script>
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
    const animation = lottie.loadAnimation({
      container: document.querySelector("#animation"),
      renderer: "svg",
      loop: !reduced.matches,
      autoplay: !reduced.matches,
      path: "./pulse.json"
    });
    const button = document.querySelector("#toggle");
    let playing = !reduced.matches;

    animation.addEventListener("DOMLoaded", () => {
      if (reduced.matches) animation.goToAndStop(0, true);
    });

    button.addEventListener("click", () => {
      playing = !playing;
      button.setAttribute("aria-pressed", String(playing));
      button.textContent = playing ? "Pausar" : "Reproducir";
      if (playing) animation.play();
      else animation.pause();
    });

    reduced.addEventListener("change", (event) => {
      if (event.matches) {
        playing = false;
        animation.pause();
        animation.goToAndStop(0, true);
        button.setAttribute("aria-pressed", "false");
        button.textContent = "Reproducir";
      }
    });

    window.addEventListener("pagehide", () => animation.destroy(), { once: true });
  </script>
</body>
</html>
