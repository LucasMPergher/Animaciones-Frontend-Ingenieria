<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parallax con GSAP</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131c; color: #f5f7ff; }
    body { margin: 0; }
    header, footer { min-height: 70svh; display: grid; place-content: center; padding: 2rem; text-align: center; }
    h1 { font-size: clamp(3rem, 10vw, 7rem); letter-spacing: -.06em; }
    .scene { position: relative; min-height: 110svh; overflow: hidden; display: grid; place-items: center; background: linear-gradient(#1d3354, #437b85 58%, #e2a66e); }
    .horizon { position: absolute; inset: 45% -10% -25%; border-radius: 50% 50% 0 0; background: linear-gradient(#293d4d, #182333); }
    .sun { position: absolute; width: min(28vw, 14rem); aspect-ratio: 1; top: 16%; left: 60%; border-radius: 50%; background: #ffe1a4; box-shadow: 0 0 5rem #ffdf9b88; }
    .label { position: relative; z-index: 1; padding: 1rem 1.3rem; border-radius: 1rem; background: #10131caa; }
  </style>
</head>
<body>
  <header><div><p>GSAP + ScrollTrigger</p><h1>Un movimiento sutil</h1><p>Desplázate por la escena.</p></div></header>
  <section class="scene" aria-label="Escena decorativa de paisaje al atardecer">
    <div class="sun" aria-hidden="true"></div><div class="horizon" aria-hidden="true"></div>
    <p class="label">Solo se activa con movimiento permitido.</p>
  </section>
  <footer><p>La escena es decorativa; el texto sigue disponible sin la animación.</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);
    const media = gsap.matchMedia();
    media.add("(prefers-reduced-motion: no-preference)", () => {
      gsap.to(".sun", {
        yPercent: 35,
        ease: "none",
        scrollTrigger: { trigger: ".scene", start: "top bottom", end: "bottom top", scrub: true }
      });
      gsap.to(".horizon", {
        yPercent: -12,
        ease: "none",
        scrollTrigger: { trigger: ".scene", start: "top bottom", end: "bottom top", scrub: true }
      });
    });
    window.addEventListener("pagehide", (event) => {
      if (!event.persisted) media.revert();
    }, { once: true });
  </script>
</body>
</html>
